<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1530" viewBox="0 0 390 1530"><style>text{font-family:Arial,sans-serif;fill:#e6ecff}.muted{fill:#a4b2cd;font-size:12px}.small{font-size:12px}.h{font-size:19px;font-weight:700}.n{font-size:23px;font-weight:700}.box{fill:#182238;stroke:#324360;stroke-width:1}</style><rect width="390" height="1530" fill="#0b1220"/>
<text x="18" y="26" class="small" fill="#8bbcff">ESKIZ V2-01 · SINTETIK · jonli hisobot emas</text><text x="18" y="60" class="h">Rahbar</text><text x="18" y="84" class="muted">Sinov kompaniyasi › Barcha loyihalar</text>
<text x="18" y="102" class="small">3 qaror · 2 obyekt · 1 shubhali shartnoma</text><rect class="box" x="16" y="110" width="358" height="210" rx="18"/><text x="32" y="130" class="h">Pul qayerda?</text><text x="32" y="155" class="muted">Summani bosing → formula va hujjat</text><text x="32" y="186">Shartnoma</text><text x="208" y="186">Tasdiqlangan F2</text><text x="32" y="217" class="n">8,0 mlrd</text><text x="208" y="217" class="n">3,2 mlrd</text><text x="32" y="250" class="small">To‘lov: kiritilmagan · 0 yozuv</text><text x="32" y="275" class="muted">Qarz to‘lov yozuvlaridan keyin aniqlanadi</text>
<text x="32" y="304" class="small">Smeta: 10,0 mlrd · bosilsa asos ochiladi</text><text x="18" y="345" class="h">Qayerga e’tibor berish kerak?</text><rect class="box" x="16" y="357" width="358" height="140" rx="18"/><circle cx="60" cy="401" r="25" fill="none" stroke="#35445e" stroke-width="8"/><circle cx="60" cy="401" r="25" fill="none" stroke="#818cf8" stroke-width="8" stroke-dasharray="50 157" transform="rotate(-90 60 401)"/><text x="42" y="406" class="small">32%</text><text x="104" y="380">Obyekt A — sintetik</text><text x="104" y="406" class="small">Smeta 10,0 mlrd · F2 3,2 mlrd</text><text x="104" y="429" class="muted">Pul bo‘yicha F2 / smeta</text><text x="32" y="464" class="small" fill="#ffca70">Narxsiz 12 qator → mavjud Mindmap</text>
<text x="18" y="527" class="h">Bugun nima qilish kerak?</text><rect class="box" x="16" y="544" width="358" height="176" rx="18"/><text x="32" y="574">1. F2 shartnomadan oshgan</text><text x="32" y="598" class="muted">Bog‘lanishni tekshiring → Ko‘rish</text><text x="32" y="631">2. Narxsiz resurslar</text><text x="32" y="655" class="muted">Smetachiga → Narx asoslari</text><text x="32" y="690" class="small">Eng muhim 5 harakat · Hammasi →</text>
<text x="18" y="764" class="h">Oyma-oy qanday ketmoqda?</text><rect class="box" x="16" y="781" width="358" height="182" rx="18"/><text x="32" y="808" class="small">F2 oylar bo‘yicha + yig‘ma chiziq</text><path d="M40 920H351M40 829V920" stroke="#40526e" fill="none"/><path d="M65 902V920M115 884V920M165 872V920M215 855V920M265 845V920M315 836V920" stroke="#818cf8" stroke-width="23"/><path d="M65 901L115 889L165 873L215 854L265 844L315 833" stroke="#2dd4bf" stroke-width="3" fill="none"/><text x="32" y="946" class="muted">Tasviriy shakl; davrlar jonli manbadan</text>
<text x="18" y="1007" class="h">Tugun dosyesi — shu komponent</text><rect class="box" x="16" y="1024" width="358" height="372" rx="18"/><text x="32" y="1053">Obyekt A › Bo‘lim › Ish › Resurs</text><text x="32" y="1083" class="small" fill="#ffca70">Xulosa → zarur qaror → mas’ul</text><rect x="32" y="1104" width="326" height="56" rx="12" fill="#263454"/><text x="44" y="1128" class="small">Shartnoma │ Smeta │ F2 │ To‘lov</text><text x="44" y="1148" class="muted">Har summa → tiyinigacha hisob asosi</text><circle cx="95" cy="1215" r="30" fill="none" stroke="#818cf8" stroke-width="15"/><circle cx="95" cy="1215" r="30" fill="none" stroke="#2dd4bf" stroke-width="15" stroke-dasharray="70 189"/><text x="155" y="1208" class="small">Smeta tarkibi</text><text x="155" y="1230" class="muted">Mehnat · Mashina · Material</text><text x="32" y="1291">Bo‘limlar → ish → resurs → hujjat</text><text x="32" y="1330" class="small">Hisob qanday olindi? ▸</text><text x="32" y="1367" class="small">Hujjatlar va eksport ▸</text>
<text x="18" y="1430" class="small">Xarita bitta: mavjud Mindmap.</text><text x="18" y="1453" class="muted">Dosye undagi tugun panelida qayta ishlatiladi.</text><text x="18" y="1483" class="muted">Bu chizma: kliklar va raqamlar sinovi keyin.</text></svg>