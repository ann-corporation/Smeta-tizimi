<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040"><style>text{font-family:Arial,sans-serif;fill:#e6ecff}.muted{fill:#a4b2cd;font-size:14px}.small{font-size:13px}.h{font-size:22px;font-weight:700}.n{font-size:31px;font-weight:700}.box{fill:#182238;stroke:#324360;stroke-width:1}</style><rect width="1440" height="1040" fill="#0b1220"/><rect width="68" height="1040" fill="#111b2d"/><text x="91" y="31" class="small">ESKIZ V2-01 · SINTETIK KO‘RINISH · jonli hisobot emas</text><text x="91" y="73" class="h">Rahbar</text><text x="91" y="100" class="muted">Sinov kompaniyasi › Barcha loyihalar</text><rect class="box" x="1098" y="49" width="300" height="50" rx="12"/><text x="1120" y="80">Mavjud Mindmap │ Hisobot</text>
<text x="91" y="120" class="small">3 qaror · 2 obyekt e’tibor talab qiladi · 1 shartnoma tekshiriladi</text><rect class="box" x="90" y="134" width="1308" height="178" rx="22"/><text x="113" y="161" class="h">Pul qayerda?</text><text x="113" y="187" class="muted">Har summa bosiladi: hisob asosi, davr, hujjatlar. QQS va nakrutka alohida belgilanadi.</text><text x="115" y="224">Shartnomalar</text><text x="355" y="224">Smeta</text><text x="600" y="224">Tasdiqlangan F2</text><text x="600" y="266" class="n">3,2 mlrd</text><text x="850" y="224">To‘lov</text><text x="1115" y="224">Qarz</text><text x="115" y="266" class="n">8,0 mlrd</text><text x="355" y="266" class="n">10,0 mlrd</text><text x="850" y="261" class="h">Kiritilmagan</text><text x="1115" y="261" class="h">Aniqlashtiriladi</text><text x="850" y="285" class="small">0 yozuv · haqiqiy 0 to‘lov emas</text>
<text x="91" y="352" class="h">Qaysi obyektga e’tibor kerak?</text><rect class="box" x="90" y="370" width="850" height="229" rx="20"/>
<circle cx="160" cy="438" r="35" fill="none" stroke="#35445e" stroke-width="10"/><circle cx="160" cy="438" r="35" fill="none" stroke="#818cf8" stroke-width="10" stroke-dasharray="70 220" transform="rotate(-90 160 438)"/><text x="144" y="444">32%</text><text x="220" y="411">Obyekt A — sintetik</text><text x="220" y="441" class="muted">Smeta 10,0 mlrd · F2 3,2 mlrd</text><text x="220" y="469" class="small">Pul bo‘yicha F2 / smeta</text><text x="117" y="522" fill="#ffca70">Narxsiz 12 qator · 2 F2 tasdiq kutmoqda</text><text x="117" y="562" class="muted">Kartochka → tayyor Mindmapdagi tugun dosyesi</text>
<text x="977" y="352" class="h">Bugun nima qilish kerak?</text><rect class="box" x="965" y="370" width="433" height="229" rx="20"/><text x="986" y="410">1. F2 / shartnoma tafovuti → Ko‘rish</text><text x="986" y="453">2. Narxsiz resurslar → Narx asoslari</text><text x="986" y="496">3. Tasdiq kutayotgan akt → Ochish</text><text x="986" y="539" class="muted">Eng muhim 5 harakat · guruhlangan</text><text x="986" y="575" class="small">Shubhali shartnoma umumiy raqamdan ajratiladi</text>
<text x="91" y="645" class="h">Oyma-oy trend</text><rect class="box" x="90" y="663" width="850" height="266" rx="20"/><text x="113" y="698" class="muted">Tasdiqlangan F2 ustunlari + kumulyativ chiziq · 12 oy</text><path d="M125 877H905M125 726V877" stroke="#40526e" fill="none"/><path d="M175 853V877M285 837V877M395 819V877M505 801V877M615 779V877M725 766V877M835 748V877" stroke="#818cf8" stroke-width="46"/><path d="M175 852L285 839L395 818L505 801L615 782L725 760L835 739" fill="none" stroke="#2dd4bf" stroke-width="4"/><text x="113" y="907" class="small">Shakl tasviriy; davrlar va qiymatlar jonli hujjatlardan olinadi</text>
<rect class="box" x="965" y="663" width="433" height="266" rx="20"/><text x="988" y="698" class="h">Har raqam o‘zini tushuntiradi</text><text x="988" y="741">1. Qanday hisoblandi?</text><text x="988" y="782">2. Qaysi hujjatdan olindi?</text><text x="988" y="823">3. Nima kiritilmagan?</text><text x="988" y="866" class="muted">To‘liq summa: tiyinigacha.</text><text x="988" y="897" class="muted">Hujjatlar/eksport: tafsilot ichida.</text><text x="91" y="979" class="small">Graf dvigateli takrorlanmaydi. Dashboard drawer va mavjud Mindmap bir TugunDosye komponentidan foydalanadi.</text><text x="91" y="1009" class="muted">Bu ekran tuzilmasi eskizi, ishlayotgan ilova yoki tekshirilgan moliyaviy hisobot emas.</text></svg>