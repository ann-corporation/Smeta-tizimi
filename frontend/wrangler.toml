name = "smeta-frontend"
compatibility_date = "2024-04-05"
# 2026-11-21: hujjat dvigateli so'rov kontekstini AsyncLocalStorage da saqlaydi (functions/_shared/hujjat-ichki.ts).
compatibility_flags = ["nodejs_als"]
pages_build_output_dir = "dist"

# 2026-10-20 (tezlik): Supabase bazasi ap-southeast-2 (Sidney) da, foydalanuvchilar O'zbekistonda. Bitta `/api`
# so'rovi bazaga 3–5 marta ketma-ket boradi (rol, tenant, sahifalar) — har biri ~0.3 s. Smart Placement funksiyani
# bazaga yaqin joyda ishga tushiradi: ichki murojaatlar millisekundlarda, uzoq yo'l esa bir marta. Middleware faqat
# functions/api/ da — statik fayllar odatdagidek foydalanuvchiga yaqin joydan beriladi. Qaytarish: shu blokni o'chirish.
[placement]
# 2026-11-22: Smart Placement «local» qoldirardi (Cf-Placement: local-AMS) — baza AWS Sidney; aniq hint.
region = "aws:ap-southeast-2"

# Jarvis Pages Function uchun Cloudflare'ning ichki AI xizmati.
# API key ishlatilmaydi: ruxsat Pages project binding orqali beriladi.
[ai]
binding = "AI"

# FILE-TRUTH-001: private canonical R2 bucket (binary truth). No public
# access, no custom domain. Dashboard "+Add" is blocked once a project's
# bindings are wrangler.toml-managed — this is the only way to add it.
[[r2_buckets]]
binding = "R2_CANONICAL"
bucket_name = "smeta-tizimi-canonical"

# ShNK normativlari (K2/K3, #304-#310): asl PDF va bo'laklar shu yopiq bucket'da (normativ/ prefiksi).
# Kod `NORMATIV_R2` nomi bilan o'qiydi; bucket R2_CANONICAL bilan bir xil, faqat alohida binding nomi.
[[r2_buckets]]
binding = "NORMATIV_R2"
bucket_name = "smeta-tizimi-canonical"

[vars]
# D2 kompozit muhr/304 (obyekt-paket): muhr funksiyalari prodda; 304 ~50 ms vs 2-5 s
OBYEKT_PAKET_ETAG = "1"
PUBLIC_ORIGIN = "https://qurai.uz"
BREND_URL = "https://qurai.uz"
# Eski hostdan 301: Google OAuth origin va BotFather /setdomain qilingach '1' ga o'zgartiriladi.
ESKI_HOST_YONLANTIRISH = "0"
# Telegram brend kanali/guruhi (sir emas): /api/telegram/kanal faqat shu chatlar bilan ishlaydi. TG_GURUH: id (-100…) yoki @username — guruh ulanganda to'ldiriladi.
TG_KANAL = "@qurai_uz"
TG_GURUH = "-1004432615700"
# Meta Graph (sir emas; META_TOKEN — Pages secret): Facebook sahifa + Instagram nashri (/api/telegram/kanal, _shared/meta-graph.ts).
# META_PAGE_ID bo'sh — ish vaqtida /me/accounts dan META_IG_ID ga mos sahifa topiladi.
META_PAGE_ID = ""
META_IG_ID = "17841473771174115"
META_GRAPH_VERSION = "v21.0"
