[package]
name = "smeta-desktop"
version = "0.1.1"
description = "QURAI Windows client"
edition = "2021"
rust-version = "1.99"
publish = false

[lib]
name = "smeta_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls"] }
aes-gcm = "=0.10.3"
base64 = "=0.23.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zeroize = "=1.9.1"
tauri-plugin-opener = "2"

# Secret storage per platform. No mock/fallback vault ships: unsupported targets fail closed.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

# Android Keystore (AES-256-GCM, non-exportable key) via the in-repo plugin.
[target.'cfg(target_os = "android")'.dependencies]
smeta-keystore = { path = "plugins/smeta-keystore" }
# Android has no system OpenSSL for native-tls: build it from source (openssl-src) for the NDK target.
openssl = { version = "0.10", features = ["vendored"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
# Legacy "local bundle + native BFF/offline lease" mode (default OFF). Build with
# `--features local-bff --config src-tauri/tauri.local-bff.conf.json`. Default build = "Onlayn qobiq".
local-bff = []
desktop-e2e = ["local-bff"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
