[package]
name = "smeta-desktop"
version = "0.1.0"
description = "TIZIM 02 Windows client"
edition = "2021"
rust-version = "1.99"
publish = false

[lib]
name = "smeta_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
keyring = { version = "=3.6.3", features = ["windows-native"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls"] }
aes-gcm = "=0.10.3"
base64 = "=0.23.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zeroize = "=1.9.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
desktop-e2e = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
