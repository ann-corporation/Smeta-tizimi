[package]
name = "smeta-keystore"
version = "0.1.0"
description = "Android Keystore-backed secret slot for the Smeta mobile client (not exposed to the WebView)"
edition = "2021"
rust-version = "1.99"
publish = false
links = "smeta-keystore"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
