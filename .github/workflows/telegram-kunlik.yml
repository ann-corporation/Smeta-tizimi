name: telegram-kunlik

# @qur_uz_bot kunlik xulosa (opt-in: foydalanuvchi /kunlik on yozgan). Kuniga bir marta (Toshkent 08:00 = 03:00 UTC).
# Yoqish: migratsiya 20261223000000 qo'llangan + GitHub sir BILDIRISHNOMA_CRON_KALIT + repo o'zgaruvchisi PROD_URL
# (bildirishnoma-yetkaz bilan bir xil sirlar). Sozlanmasa ish jim o'tkazib yuboriladi. Partiyalab: har chaqiruv ≤ 4 foydalanuvchi, `keyingi` bilan davom.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-kunlik
  cancel-in-progress: false

jobs:
  kunlik:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BILDIRISHNOMA_CRON_KALIT: ${{ secrets.BILDIRISHNOMA_CRON_KALIT }}
      PROD_URL: ${{ vars.PROD_URL }}
    steps:
      - name: Kunlik xulosa
        run: |
          if [ -z "$BILDIRISHNOMA_CRON_KALIT" ] || [ -z "$PROD_URL" ]; then
            echo "BILDIRISHNOMA_CRON_KALIT yoki PROD_URL sozlanmagan — o'tkazib yuborildi."; exit 0
          fi
          keyin=0
          for i in $(seq 1 100); do
            code=$(curl -sS -o resp.json -w '%{http_code}' -X POST "$PROD_URL/api/telegram/kunlik" \
              -H 'Content-Type: application/json' -H "X-Cron-Kalit: $BILDIRISHNOMA_CRON_KALIT" \
              --data "{\"keyin_id\":$keyin}" --max-time 60 || echo 000)
            echo "HTTP $code"; head -c 200 resp.json; echo
            if [ "$code" != "200" ]; then echo "::warning::telegram-kunlik muvaffaqiyatsiz (HTTP $code)"; exit 0; fi
            keyin=$(grep -o '"keyingi":[0-9]*' resp.json | head -1 | cut -d: -f2)
            if [ -z "$keyin" ]; then break; fi
          done