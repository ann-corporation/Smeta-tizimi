# Mobile + macOS shells of Smeta Tizimi (Tauri 2). Public repo: no secrets are created here; signing is optional.
# Security posture: contents:read by default, no pull_request_target, no persisted checkout credentials,
# release signing material is never exposed to pull_request runs, secrets only reach the single step that needs them
# (via env, never echoed). The ONLY job with contents:write is `release`, scoped to v* tags; it never checks out code.
name: Mobile

on:
  pull_request:
    paths:
      - 'frontend/src-tauri/**'
      - 'frontend/src/desktop/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_CLI: '2.12.4'
  RUST_TOOLCHAIN: '1.99.1'
  NODE_VERSION: '24'
  ANDROID_PLATFORM: 'android-36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK: '27.2.12479018'
  # Public build settings (lease public key pin); empty means offline cache stays denied. Not secrets.
  VITE_DESKTOP_LEASE_PK: ${{ vars.SMETA_DESKTOP_LEASE_PK }}
  VITE_DESKTOP_LEASE_KID: ${{ vars.SMETA_DESKTOP_LEASE_KID }}

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Release signing only outside pull_request; otherwise a debug-signed APK is produced.
      RELEASE_SIGNING: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Android SDK/NDK (pinned)
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK}" "platform-tools"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK}" >> "$GITHUB_ENV"
      - name: Rust toolchain + Android targets
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal \
            -t aarch64-linux-android -t armv7-linux-androideabi -t x86_64-linux-android
          rustup default "${RUST_TOOLCHAIN}"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: mobile-android-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
      - run: npm ci
      - name: App icons (generated from mobile/app-icon.svg)
        run: npx --yes @tauri-apps/cli@${TAURI_CLI} icon src-tauri/mobile/app-icon.svg
      - name: Android project (generated unless committed)
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx --yes @tauri-apps/cli@${TAURI_CLI} android init --ci
          fi
          npx --yes @tauri-apps/cli@${TAURI_CLI} icon src-tauri/mobile/app-icon.svg
          node src-tauri/mobile/android-overlay.mjs src-tauri/gen/android
      - name: Build release APK (unsigned)
        run: npx --yes @tauri-apps/cli@${TAURI_CLI} android build --apk --target aarch64 armv7 x86_64 --ci
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +x
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          BT="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}"
          UNSIGNED=$(find src-tauri/gen/android -name '*-unsigned.apk' | head -n1)
          test -n "$UNSIGNED" || { echo "unsigned APK not found"; exit 1; }
          mkdir -p "$RUNNER_TEMP/out"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          if [ "$RELEASE_SIGNING" = "true" ]; then
            OUT="$RUNNER_TEMP/out/smeta-tizimi-${VERSION}-release.apk"
            KS="$RUNNER_TEMP/release.keystore"
            printf '%s' "$KS_B64" | base64 -d > "$KS"
            "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$OUT" "$RUNNER_TEMP/aligned.apk"
            rm -f "$KS"
          else
            # Throwaway debug key, generated per run with the public Android debug convention. NOT a release key.
            OUT="$RUNNER_TEMP/out/smeta-tizimi-${VERSION}-debug.apk"
            KS="$RUNNER_TEMP/debug.keystore"
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
            "$BT/apksigner" sign --ks "$KS" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
              --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          fi
          "$BT/apksigner" verify --print-certs "$OUT" | grep -v -i 'SHA' || true
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"
      - name: Manifest policy check (no location/contacts/storage/mic)
        run: |
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2" dump permissions "$APK_PATH" | tee "$RUNNER_TEMP/perms.txt"
          if grep -E 'LOCATION|CONTACTS|EXTERNAL_STORAGE|RECORD_AUDIO' "$RUNNER_TEMP/perms.txt"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      IOS_SIGNING: ${{ github.event_name != 'pull_request' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_PROVISIONING_PROFILE != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY_P8 != '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Rust toolchain + iOS targets
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal -t aarch64-apple-ios -t aarch64-apple-ios-sim
          rustup default "${RUST_TOOLCHAIN}"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: mobile-ios-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
      - run: npm ci
      - run: brew install xcodegen
      - name: App icons
        run: npx --yes @tauri-apps/cli@${TAURI_CLI} icon src-tauri/mobile/app-icon.svg
      - name: Compile proof (frontend + Rust for iOS simulator)
        run: |
          npx vite build --config src-tauri/vite.desktop.config.ts
          (cd src-tauri && cargo build --locked --release --lib --target aarch64-apple-ios-sim)
      - name: iOS project (generated unless committed)
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            npx --yes @tauri-apps/cli@${TAURI_CLI} ios init --ci
          fi
      - name: Simulator build (no signing; best-effort packaging proof)
        if: env.IOS_SIGNING != 'true'
        continue-on-error: true
        run: npx --yes @tauri-apps/cli@${TAURI_CLI} ios build --target aarch64-sim --debug --ci
      - name: Signed IPA (TestFlight)
        if: env.IOS_SIGNING == 'true'
        env:
          # Names follow the Tauri iOS CI contract; values come from the APPLE_* repository secrets.
          IOS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +x
          npx --yes @tauri-apps/cli@${TAURI_CLI} ios build --export-method app-store-connect --ci
          IPA=$(find src-tauri/gen/apple/build -name '*.ipa' | head -n1)
          test -n "$IPA" || { echo "IPA not found"; exit 1; }
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p "$RUNNER_TEMP/out"
          cp "$IPA" "$RUNNER_TEMP/out/smeta-tizimi-${VERSION}.ipa"
          echo "IPA_PATH=$RUNNER_TEMP/out/smeta-tizimi-${VERSION}.ipa" >> "$GITHUB_ENV"
      - name: Upload to TestFlight
        if: env.IOS_SIGNING == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set +x
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPLE_API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
      - uses: actions/upload-artifact@v4
        if: env.IOS_SIGNING == 'true'
        with:
          name: ios-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 30

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MAC_SIGNING: ${{ github.event_name != 'pull_request' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Rust toolchain + macOS targets
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal -t aarch64-apple-darwin -t x86_64-apple-darwin
          rustup default "${RUST_TOOLCHAIN}"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: mobile-macos-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
      - run: npm ci
      - name: App icons (incl. icns)
        run: npx --yes @tauri-apps/cli@${TAURI_CLI} icon src-tauri/mobile/app-icon.svg
      - name: Native tests (macOS host)
        run: |
          npx vite build --config src-tauri/vite.desktop.config.ts
          (cd src-tauri && cargo test --locked)
      - name: Build universal DMG
        env:
          # Empty on pull_request and when secrets are absent => unsigned (ad-hoc) DMG.
          APPLE_CERTIFICATE: ${{ env.MAC_SIGNING == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.MAC_SIGNING == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ env.MAC_SIGNING == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ env.MAC_SIGNING == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ env.MAC_SIGNING == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.MAC_SIGNING == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set +x
          npx --yes @tauri-apps/cli@${TAURI_CLI} build --target universal-apple-darwin --bundles dmg --ci
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n1)
          test -n "$DMG" || { echo "DMG not found"; exit 1; }
          SUFFIX=unsigned; [ "$MAC_SIGNING" = "true" ] && SUFFIX=signed
          mkdir -p "$RUNNER_TEMP/out"
          cp "$DMG" "$RUNNER_TEMP/out/smeta-tizimi-${VERSION}-macos-universal-${SUFFIX}.dmg"
          echo "DMG_PATH=$RUNNER_TEMP/out/smeta-tizimi-${VERSION}-macos-universal-${SUFFIX}.dmg" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error
          retention-days: 30

  # The only job with write access. Runs on v* tags only, never checks out or executes repository code,
  # and creates a DRAFT release for owner review. Debug-signed APKs and unsigned DMGs are never attached.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
      - name: Draft release with signed artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          FILES=$(find dist-release -type f \( -name '*-release.apk' -o -name '*-signed.dmg' -o -name '*.ipa' \))
          if [ -z "$FILES" ]; then echo "No signed artifacts (secrets not configured): nothing attached."; exit 0; fi
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --draft --title "$TAG" --notes "Native builds. Review before publishing."
          # shellcheck disable=SC2086
          gh release upload "$TAG" --repo "$REPO" --clobber $FILES